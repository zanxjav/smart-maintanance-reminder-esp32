<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rounded App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Outer Speedometer Track -->
  <path d="M 106 356 A 170 170 0 1 1 406 356" fill="none" stroke="#334155" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Active Blue Glow Speed Track -->
  <path d="M 106 356 A 170 170 0 1 1 360 180" fill="none" stroke="url(#cyanBlue)" stroke-width="24" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Speedometer Ticks -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="4 28"/>

  <!-- Center Hub & Needle -->
  <circle cx="256" cy="256" r="28" fill="#0f172a" stroke="url(#cyanBlue)" stroke-width="6"/>
  <polygon points="250,256 262,256 257,130 255,130" fill="url(#cyanBlue)" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="10" fill="#38bdf8"/>

  <!-- Digital Speed Display Text -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">SCADA</text>
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="4">VEHICLE</text>
</svg>
